name: Deploy

# Every push to main runs CI, then builds one image and deploys it to the two existing Cloud Run services.
# The project may host other services, so the deploy identity is scoped to Tifa: it may update tifa-api and
# tifa-poller (roles/run.developer on each service), push to the tifa-images repository and run the services as their
# own accounts, and nothing else. It cannot create a service or change who may call one: infra/first-deploy.sh
# creates the services once with an operator's credentials, and infra/post-deploy.sh owns their IAM.
# Authentication is keyless (Workload Identity Federation). The project ID, provider and deploy account come from
# repository SECRETS, so they are masked in this public repository's logs; none are committed. Other settings are
# repository variables. Service names and settings come from infra/lib.sh, which infra/first-deploy.sh uses too.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      GITLEAKS_PRIVATE_TERMS: ${{ secrets.GITLEAKS_PRIVATE_TERMS }}

  deploy:
    name: Deploy to Cloud Run
    needs: ci
    # Forks and copies without TIFA_DEPLOY=true skip deployment instead of failing.
    if: github.ref == 'refs/heads/main' && vars.TIFA_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # for the Workload Identity Federation token exchange
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
      TFL_APP_KEY_VERSION: ${{ vars.TFL_APP_KEY_VERSION }} # empty until a key exists: the poller runs anonymously
      TIFA_PUBLIC_SOURCES: ${{ vars.TIFA_PUBLIC_SOURCES || 'a' }} # "f" (TfL's FOI release) needs TfL's re-use permission
      TIFA_ALLOWED_HOSTS: ${{ vars.TIFA_ALLOWED_HOSTS }} # custom domains for MCP, comma-separated
      TIFA_POLLER_INGRESS: ${{ vars.TIFA_POLLER_INGRESS || 'all' }}
    steps:
      - name: Check the repository secrets and variables
        run: |
          fail() { echo "::error::$1"; failed=1; }
          failed=0
          [[ $GCP_PROJECT_ID =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || fail "GCP_PROJECT_ID is missing or not a project ID"
          [[ $GCP_REGION =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || fail "GCP_REGION is missing or not a region"
          [[ $GCP_WIF_PROVIDER =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/tifa-github/providers/[a-z0-9-]+$ ]] \
            || fail "GCP_WIF_PROVIDER is missing or not a provider of the tifa-github pool"
          [[ $GCP_DEPLOY_SA =~ ^tifa-deploy@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]] \
            || fail "GCP_DEPLOY_SA is missing or not the tifa-deploy service account's email"
          [[ -z $TFL_APP_KEY_VERSION || $TFL_APP_KEY_VERSION =~ ^[1-9][0-9]*$ ]] \
            || fail "TFL_APP_KEY_VERSION must be a secret version number (not 'latest')"
          [[ $TIFA_PUBLIC_SOURCES =~ ^[af](,[af])?$ ]] || fail "TIFA_PUBLIC_SOURCES must be a or a,f"
          [[ -z $TIFA_ALLOWED_HOSTS || $TIFA_ALLOWED_HOSTS =~ ^[a-z0-9.:*-]+(,[a-z0-9.:*-]+)*$ ]] \
            || fail "TIFA_ALLOWED_HOSTS must be comma-separated host names"
          [[ $TIFA_POLLER_INGRESS =~ ^(all|internal)$ ]] || fail "TIFA_POLLER_INGRESS must be all or internal"
          exit "$failed"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Before the build: CI only updates the services, so stop early, with instructions, if they are not there.
      - name: Find the services
        id: target
        run: |
          . infra/lib.sh
          tifa_check_deploy_settings
          tifa_require_services
          echo "image=$(tifa_image_repo)" >> "$GITHUB_OUTPUT"

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.target.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy the poller (private)
        env:
          IMAGE: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          . infra/lib.sh
          tifa_check_deploy_settings
          tifa_deploy_poller "$IMAGE"

      - name: Deploy the API (public)
        env:
          IMAGE: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          . infra/lib.sh
          tifa_check_deploy_settings
          tifa_deploy_api "$IMAGE"

      - name: Smoke test
        run: |
          . infra/lib.sh
          url=$(gcloud run services describe "$API_SERVICE" --region="$GCP_REGION" --format='value(status.url)')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url/healthz" || true)
          case "$code" in
            200) echo "API /healthz: 200" ;;
            503) echo "::notice::API /healthz: 503 (no recent poll yet, or the Scheduler is paused)" ;;
            403) echo "::notice::API /healthz: 403 (not public yet, run infra/post-deploy.sh, or closed by the guard)" ;;
            *) echo "::error::API /healthz answered ${code:-nothing}"; exit 1 ;;
          esac

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          . infra/lib.sh
          {
            echo "### Deployed ${GITHUB_SHA::12}"
            echo
            echo "| Service | Revision |"
            echo "| --- | --- |"
            for svc in "$POLLER_SERVICE" "$API_SERVICE"; do
              rev=$(gcloud run services describe "$svc" --region="$GCP_REGION" --format='value(status.latestReadyRevisionName)')
              echo "| $svc | $rev |"
            done
            echo
            echo "Image digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
